<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V Chandu | Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#050816;
color:#fff;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
background:
radial-gradient(circle at top left,#2563eb33,transparent 45%),
radial-gradient(circle at bottom right,#9333ea33,transparent 45%),
#050816;
}

.hero h1{
font-size:60px;
font-weight:800;
margin-bottom:15px;
}

.hero span{
color:#38bdf8;
}

.hero h2{
font-size:26px;
font-weight:400;
color:#cbd5e1;
margin-bottom:25px;
}

.hero p{
max-width:700px;
line-height:1.8;
font-size:18px;
color:#94a3b8;
}

.btn{
margin-top:40px;
display:inline-block;
padding:15px 35px;
background:#2563eb;
border-radius:50px;
text-decoration:none;
color:white;
font-weight:600;
transition:.3s;
}

.btn:hover{
transform:translateY(-6px);
background:#1d4ed8;
}

.scroll{
position:absolute;
bottom:30px;
font-size:14px;
color:#94a3b8;
animation:updown 1.8s infinite;
}

@keyframes updown{
0%{transform:translateY(0);}
50%{transform:translateY(10px);}
100%{transform:translateY(0);}
}
</style>

</head>

<body>

<section class="hero">

<h1>Hello, I'm <span>V Chandu</span></h1>

<h2>Electronics & Communication Engineering Student</h2>

<p>
Aspiring Software Developer passionate about Java, Python,
Web Development, Embedded Systems and AI.
I enjoy building modern applications and continuously improving my skills.
</p>

<a href="#about" class="btn">
Explore Portfolio
</a>

<div class="scroll">
⬇ Scroll Down
</div>

</section>

</body>
</html>
